# Robot Mech — CI. docs/PLATFORM_STANDARD.md §10
#
# Two tiers, because they have very different runtimes:
#
#   fast    (~2 min)  every push and PR. Typecheck, the 8 offline validators, and the
#                     convergence gates. This is the tier that must stay green.
#   browser (slow)    nightly + manual + release. Drives a real headless Chromium over
#                     a preview server. Measured locally: one campaign mission takes
#                     ~45 s of browser time (swiftshader is CPU-rendered), so all 22
#                     would be far too slow to block a push.
#
# Gate numbering matches PLATFORM_STANDARD.md §10.2.

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 15 * * *'     # nightly browser tier
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  fast:
    name: fast gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # ── gate 1: typecheck ────────────────────────────────────────────────
      - name: 'Gate 1 — typecheck'
        run: npx tsc --noEmit

      # ── gate 2: the existing validators (all 8 verified offline-safe) ────
      # These already encode real knowledge about this content. Making them
      # mandatory is the cheapest quality win available on this project.
      - name: 'Gate 2a — content validators'
        run: |
          node scripts/validate_campaign.mjs
          node scripts/validate_hangar.mjs
          node scripts/validate_nav.mjs
          node scripts/lint_bt.mjs

      # §3.3 — one content schema. Types, stable machine IDs, uniqueness, and the
      # referential integrity no single file can check for itself: a mission whose
      # playerMech or step target does not exist is uncompletable, and this catches it
      # in milliseconds where test_campaign.mjs needs ~45 s of browser per mission.
      - name: 'Gate 2h — content schema'
        run: node scripts/content_schema.mjs

      - name: 'Gate 2b — unit and service suites'
        run: |
          node scripts/test_hangar.mjs
          node scripts/test_accounts.mjs
          node scripts/test_sync.mjs
          node scripts/test_nav_unit.mjs

      # ── gate 6: no secrets anywhere in the tree or a build artefact ──────
      - name: 'Gate 6 — no secrets committed'
        run: |
          set -euo pipefail
          # Real key material, not the word "key". .env.example ships empty values.
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|glk_live_[A-Za-z0-9]{10,}|AIza[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,})' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=_inbox . ; then
            echo "::error::key-shaped string committed"; exit 1
          fi
          # Any VITE_-prefixed variable holding something secret-shaped is a leak by
          # definition — VITE_ vars are inlined into the client bundle.
          if grep -rInE 'VITE_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)' \
               --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::secret behind a public VITE_ prefix — rotate it"; exit 1
          fi
          echo "no secrets found"

      # ── gate 7: franchise + retired-canon scan ───────────────────────────
      # docs/IP_EXCLUSION_CHECKLIST.md §B.
      #
      # Design notes, learned by running the naive version against the real tree:
      #  * Word boundaries are mandatory. Unbounded 'thor' matches 'author' and
      #    produced ~93 false positives.
      #  * 'atlas' is NOT a term here — "texture atlas" is standard vocabulary.
      #  * IP_EXCLUSION_CHECKLIST.md is the term inventory, while the convergence
      #    plan and renderer-migration ADR preserve exact names as historical
      #    evidence. Gate 7b excludes only those named records. The former working
      #    folder label is tracked internally by 7c and prohibited on every
      #    shipping surface by 7a.
      - name: 'Gate 7a — shipping surfaces (zero tolerance)'
        run: |
          set -euo pipefail
          # Anything here reaches players. No exceptions, no allowlist.
          TERMS='dresari|kentares|steiner|davion|liao|marik|kurita|comstar|clanner'
          TERMS="$TERMS"'|daishi|vulture|timberwolf|madcat|mauler|uziel'
          TERMS="$TERMS"'|battlemech|battletech|mechwarrior|inner[[:space:]_-]+sphere'
          TERMS="$TERMS"'|sovereign[[:space:]_-]+ash|nareth'
          TERMS="$TERMS"'|meridian[[:space:]_-]+assembly|helix[[:space:]_-]+directorate'
          hits=$(grep -rniaoE "\\b($TERMS)\\b" \
                  src content worker public ./*.html || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::franchise or retired-canon term on a SHIPPING surface"
            exit 1
          fi
          echo "shipping surfaces clean"

      - name: 'Gate 7b — protected and retired terms in source'
        run: |
          set -euo pipefail
          # The internal working-folder label is handled by 7c; all other protected
          # proper nouns are forbidden in source regardless of capitalization.
          PROTECTED='dresari|kentares|steiner|davion|liao|marik|kurita|comstar|clanner'
          PROTECTED="$PROTECTED"'|daishi|vulture|timberwolf|madcat|mauler|uziel'
          PROTECTED="$PROTECTED"'|battlemech|battletech|inner[[:space:]_-]+sphere'
          protected_hits=$(grep -rInioE "\\b($PROTECTED)\\b" \
                  --exclude-dir=node_modules --exclude-dir=.git \
                  --exclude-dir=_inbox \
                  --exclude=IP_EXCLUSION_CHECKLIST.md \
                  --exclude=CONVERGENCE_PLAN.md \
                  docs src content scripts server worker README.md package.json || true)
          if [ -n "$protected_hits" ]; then
            echo "$protected_hits"
            echo "::error::protected proper noun outside the exact history exclusions"
            exit 1
          fi

          # Retired-canon terms are also hard failures in source. Preserve only
          # the exact convergence record, renderer migration ADR, checklist, and
          # inherited read-only briefs that document why those terms were retired.
          RETIRED='sovereign[[:space:]_-]+ash|nareth'
          RETIRED="$RETIRED"'|meridian[[:space:]_-]+assembly'
          RETIRED="$RETIRED"'|helix[[:space:]_-]+directorate'
          retired_hits=$(grep -rInioE "\\b($RETIRED)\\b" \
                  --exclude-dir=node_modules --exclude-dir=.git \
                  --exclude-dir=_inbox \
                  --exclude=IP_EXCLUSION_CHECKLIST.md \
                  --exclude=CONVERGENCE_PLAN.md \
                  --exclude=0001-renderer-three-vs-babylon.md \
                  docs src content scripts server worker README.md package.json || true)
          if [ -n "$retired_hits" ]; then
            echo "$retired_hits"
            echo "::error::retired-canon term outside the exact history exclusions"
            exit 1
          fi
          echo "source terms clean"

      - name: 'Gate 7c — completed rename and retired-canon inventory'
        run: |
          set -euo pipefail
          # Robot Mech is now the shipping title. Historical evidence in the
          # convergence record and the exclusion checklist is intentionally
          # preserved; no other source/config/document may revive the former
          # third-party working label.
          wt=$( { grep -rIioE '\bmechwarrior\b' docs src content scripts server \
                 README.md package.json --exclude-dir=_inbox \
                 --exclude=CONVERGENCE_PLAN.md \
                 --exclude=IP_EXCLUSION_CHECKLIST.md || true; } | wc -l | tr -d ' ')
          rc=$(grep -rIioE '\b(sovereign ash|nareth|meridian assembly|helix directorate)\b' \
                 docs src content scripts server README.md package.json \
                 --exclude-dir=_inbox | wc -l | tr -d ' ')
          echo "former working-label mentions outside historical records: $wt (required 0)"
          echo "retired-canon mentions in internal docs: $rc (baseline 24)"
          if [ "$wt" -ne 0 ]; then
            echo "::error::former working label survived the Robot Mech rename"
            exit 1
          fi
          [ "$rc" -gt 24 ] && echo "::warning::retired-canon mentions grew past baseline"
          exit 0

      - name: 'Gate 7d — Robot Mech identity and deployment configuration'
        run: npm run brandcheck

      # ── gate 8: Drive-sync hygiene ───────────────────────────────────────
      - name: 'Gate 8 — Drive hygiene'
        run: |
          set -euo pipefail
          # Drive conflict duplicates: "file (1).ts" that still compiles is a silent
          # bug factory.
          if find . -path ./node_modules -prune -o -regex '.*([0-9])\..*' -print | grep .; then
            echo "::error::Drive conflict duplicate committed"; exit 1
          fi
          # macOS is case-insensitive, this runner is not.
          if git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d | grep .; then
            echo "::error::case-only filename collision — will break on Linux"; exit 1
          fi
          # An unquoted $MW_ROOT splits on the spaces and the @ in the real path.
          if grep -rn '\$MW_ROOT[^"/]' ops scripts 2>/dev/null \
             | grep -v 'drive-hygiene\.sh:' \
             | awk -F: '{ c=$0; sub(/^[^:]*:[0-9]+:/,"",c); sub(/^[ \t]+/,"",c); if (c !~ /^#/) print }' \
             | grep .; then
            echo "::error::unquoted \$MW_ROOT"; exit 1
          fi
          echo "hygiene clean"

      # ── gate 15: build and bundle budget ─────────────────────────────────
      # This builds WITHOUT the asset trees (they are Drive-only). site-truth takes its
      # asset numbers from content/asset-census.json, which is re-derived and drift-
      # checked on every build that does have the assets — see scripts/asset_census.mjs.
      # Verified: the assets-less build produces a byte-identical index.html.
      - name: 'Gate 15 — build and bundle budget'
        run: |
          set -euo pipefail
          npm run build
          # Cloudflare Pages Direct Upload rejects any single file over 25 MiB.
          # This fast job has no Drive-backed asset trees, so it guards the
          # asset-less application bundle; the asset runner below checks the
          # complete release package.
          big=$(find dist -type f -size +25M || true)
          if [ -n "$big" ]; then echo "$big"; echo "::error::file exceeds the Workers 25 MiB limit"; exit 1; fi
          echo "dist total: $(du -sh dist | cut -f1)"

  # ───────────────────────────────────────────────────────────────────────────
  # Everything below needs public/models, public/audio and public/textures on disk —
  # to build at all (site-truth scans them) and to render anything meaningful. Those
  # trees are Drive-only, so this job requires a self-hosted runner whose checkout has
  # them linked in, and is opted into with the repo variable ASSET_RUNNER=true.
  #
  # Until that runner exists this job does not run. That is a real coverage gap, stated
  # plainly rather than papered over with a green check: nothing in GitHub CI currently
  # builds the bundle or plays a mission. Closing it means one of —
  #   1. git-lfs for public/ (400 MB; GitHub's free LFS bandwidth is 1 GB/month, so CI
  #      clones would exhaust it quickly),
  #   2. publishing the asset trees as a release artefact CI fetches, or
  #   3. deriving site-truth counts from a committed manifest, kept honest by a local
  #      manifest-vs-filesystem check.
  # Option 3 is the cheapest and keeps the truth guarantee; it is a design change to a
  # load-bearing plugin, so it is not made unilaterally here.
  build-assets:
    name: build + browser gates (needs assets)
    if: >-
      vars.ASSET_RUNNER == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Compatibility label on the already-provisioned external runner. Rename it
    # only together with the runner itself; a repo-only label change strands CI.
    runs-on: [self-hosted, veyra-assets]
    timeout-minutes: 120
    steps:
      # The asset trees are gitignored symlinks provisioned once by
      # ops/scripts/bootstrap.sh. checkout's default git clean -ffdx would
      # delete them before this job could verify or build the complete release.
      # release:prepare below hash-checks the preserved trees against the
      # committed census, so stale or substituted assets still fail closed.
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: 'Gate 15 — build and bundle budget'
        run: |
          set -euo pipefail
          test -d public/models || { echo "::error::assets missing on this runner"; exit 1; }
          npm run release:prepare
          # release:prepare checks complete asset census/hash parity, source-only
          # pruning, required headers and Cloudflare Pages limits. Keep this
          # independent size assertion as a readable CI failure.
          big=$(find dist -type f -size +25M || true)
          if [ -n "$big" ]; then echo "$big"; echo "::error::file exceeds the Workers 25 MiB limit"; exit 1; fi
          echo "dist total: $(du -sh dist | cut -f1)"

      # These suites need the built game served on :4199.
      # dist/ already exists from gate 15 above; just serve it.
      - name: serve
        run: |
          npm run preview &
          npx wait-on http://localhost:4199 -t 60000

      # NOTE: these drive a real browser and are slow. They are gated to nightly
      # and manual runs for that reason, NOT because they are optional.
      - name: 'Gate 2c — tutorial completion'
        run: node scripts/test_bt.mjs

      - name: 'Gate 2d — navigation'
        run: node scripts/test_nav.mjs

      - name: 'Gate 2e — hangar UI'
        run: node scripts/test_hangar_ui.mjs

      - name: 'Gate 7e — Robot Mech rendered identity'
        run: npm run brandui -- http://localhost:4199

      # Serial by design. Measured locally: m04 alone 45 s and m21b alone 100 s, but
      # the two together at the old hardcoded concurrency of 2 did not finish inside
      # 600 s — CPU-rendered swiftshader contexts starve each other. 22 missions
      # serially is roughly 25–40 min, which the 120-minute job timeout covers.
      - name: 'Gate 2f — campaign completability (all 22 configs)'
        run: node scripts/test_campaign.mjs --conc 1

      - name: 'Gate 2g — save/sync through the real UI'
        run: node scripts/verify_save.mjs

      # §5.6 — lighting verification. Measures the cast shadow against open ground at a
      # FIXED camera and sim state across all four §5.7 presets, so a lighting change
      # that washes shadows out fails a number instead of surviving until someone
      # notices. Needs the assets, hence this job.
      - name: 'Gate 16 — lighting probe (all presets)'
        run: node scripts/lightprobe.mjs

      # §6.6 asset QC. Baseline-aware: 111 of 153 shipped models are over their §6.8
      # budget because the generator used one face_limit for every class (every asset is
      # ~112,800 triangles, hero mech or supply crate alike). That debt is recorded in
      # content/asset-qc-baseline.json and this gate fails on REGRESSION — a model that
      # was passing and now fails, or a known-bad one that got worse. Shrink the baseline
      # by fixing assets, never by raising a budget.
      - name: 'Gate 17 — Tripo asset QC (§6.6)'
        run: node scripts/tripo_qc.mjs
