<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROBOT MECH — Asset Viewer</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10141a; font-family: 'Courier New', monospace; }
      #bar { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; gap: 8px; z-index: 5; background: rgba(8,14,12,.7); }
      #bar button { background: none; border: 1px solid #7ee6b0; color: #7ee6b0; padding: 6px 14px; cursor: pointer; font-family: inherit; }
      #bar button:hover, #bar button.on { background: rgba(126,230,176,.18); }
      #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ffb347; text-align: center; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="msg"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
